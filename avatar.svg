<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Pablo Rodríguez Garijo ASCII avatar</title>
  <desc id="desc">A terminal-style ASCII portrait representing Pablo Just Develops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="720" height="720" rx="28" fill="url(#bg)"/>
  <rect x="22" y="22" width="676" height="676" rx="20" fill="none" stroke="#374151" stroke-width="3"/>
  <circle cx="54" cy="55" r="9" fill="#fb7185"/>
  <circle cx="82" cy="55" r="9" fill="#fbbf24"/>
  <circle cx="110" cy="55" r="9" fill="#34d399"/>
  <text x="145" y="62" fill="#9ca3af" font-family="monospace" font-size="22">pablo@github:~/avatar</text>
  <text x="55" y="125" fill="#60a5fa" font-family="monospace" font-size="22">$ whoami</text>
  <text x="55" y="158" fill="#d1d5db" font-family="monospace" font-size="22">PabloJustDevelops</text>
  <g fill="#d1d5db" font-family="monospace" font-size="29" text-anchor="middle" filter="url(#glow)">
    <text x="360" y="245">.-&quot;&quot;&quot;&quot;-.</text>
    <text x="360" y="278">.'  .--.  '.</text>
    <text x="360" y="311">/   /    \   \</text>
    <text x="360" y="344">;   |  o o |   ;</text>
    <text x="360" y="377">|   |   ^  |   |</text>
    <text x="360" y="410">;   | \___/|   ;</text>
    <text x="360" y="443">\   \____/   /</text>
    <text x="360" y="476">'.        .'</text>
    <text x="360" y="509">'-.__.-'</text>
    <text x="360" y="542">/|  |\</text>
    <text x="360" y="575">/ |  | \</text>
    <text x="360" y="608">/  |  |  \</text>
    <text x="360" y="641">/___|__|___\</text>
  </g>
  <text x="360" y="678" fill="#f59e0b" font-family="monospace" font-size="18" text-anchor="middle">BUILD • LEARN • SHIP</text>
</svg>
